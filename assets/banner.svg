<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.25)" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.15)" />
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.2)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveScan {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbMove {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(25px, -20px); }
      }

      .floating-bg-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .floating-bg-2 { animation: floatReverse 8s ease-in-out infinite; transform-origin: center; }
      .pulsing-orb { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .ambient-orb { animation: orbMove 9s ease-in-out infinite; }
      .scan-wave {
        stroke-dasharray: 200 400;
        animation: waveScan 6s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g class="ambient-orb" opacity="0.6">
    <circle cx="180" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.12" class="pulsing-orb" />
    <circle cx="1020" cy="320" r="160" fill="#c084fc" filter="url(#glow)" opacity="0.15" class="pulsing-orb" />
    <circle cx="600" cy="50" r="100" fill="#818cf8" filter="url(#glow)" opacity="0.1" />
  </g>

  <!-- Animated Sensory Waves (Background Waveforms) -->
  <g opacity="0.35">
    <path class="scan-wave" d="M 50 360 Q 200 290 350 360 T 650 360 T 950 360 T 1150 360" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="scan-wave" d="M 50 380 Q 250 320 450 380 T 850 380 T 1150 380" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Dynamic Floating Decorative Context Cards in Background (Side Wings) -->
  <g class="floating-bg-1" opacity="0.75">
    <!-- Left Sensory Metric Card -->
    <g transform="translate(60, 110)">
      <rect width="210" height="175" rx="14" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
      <text x="18" y="32" fill="#38bdf8" class="badge-text">FACIAL ACTION UNITS</text>
      <!-- Mini Mock Emotion Bar Chart -->
      <rect x="18" y="50" width="130" height="10" rx="5" fill="rgba(56, 189, 248, 0.2)" />
      <rect x="18" y="50" width="105" height="10" rx="5" fill="#38bdf8" />
      <text x="156" y="59" fill="#94a3b8" font-size="10" font-family="sans-serif">82%</text>

      <rect x="18" y="72" width="130" height="10" rx="5" fill="rgba(129, 140, 248, 0.2)" />
      <rect x="18" y="72" width="85" height="10" rx="5" fill="#818cf8" />
      <text x="156" y="81" fill="#94a3b8" font-size="10" font-family="sans-serif">64%</text>

      <rect x="18" y="94" width="130" height="10" rx="5" fill="rgba(192, 132, 252, 0.2)" />
      <rect x="18" y="94" width="120" height="10" rx="5" fill="#c084fc" />
      <text x="156" y="103" fill="#94a3b8" font-size="10" font-family="sans-serif">91%</text>

      <!-- Mini Pulse line -->
      <path d="M 18 140 L 45 140 L 55 125 L 68 150 L 78 135 L 88 140 L 190 140" fill="none" stroke="#38bdf8" stroke-width="2" />
      <text x="18" y="162" fill="#64748b" font-size="10" font-family="sans-serif">Real-Time Valence / Arousal</text>
    </g>
  </g>

  <g class="floating-bg-2" opacity="0.75">
    <!-- Right Multimodal Sensor Card -->
    <g transform="translate(930, 110)">
      <rect width="210" height="175" rx="14" fill="#0f172a" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
      <text x="18" y="32" fill="#c084fc" class="badge-text">MULTIMODAL FUSION</text>
      <!-- Sensor indicators -->
      <circle cx="28" cy="62" r="5" fill="#38bdf8" />
      <text x="42" y="66" fill="#cbd5e1" font-size="12" font-family="sans-serif">Vocal Prosody &amp; Pitch</text>

      <circle cx="28" cy="88" r="5" fill="#818cf8" />
      <text x="42" y="92" fill="#cbd5e1" font-size="12" font-family="sans-serif">Gaze &amp; Eye-Tracking</text>

      <circle cx="28" cy="114" r="5" fill="#c084fc" />
      <text x="42" y="118" fill="#cbd5e1" font-size="12" font-family="sans-serif">EEG &amp; Biometrics</text>

      <circle cx="28" cy="140" r="5" fill="#34d399" />
      <text x="42" y="144" fill="#cbd5e1" font-size="12" font-family="sans-serif">Contextual Sentiment</text>
    </g>
  </g>

  <!-- FOREGROUND: High-Contrast Pristine Hero Typography -->
  <!-- Category Pill Badge -->
  <g transform="translate(430, 52)">
    <rect width="340" height="34" rx="17" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" class="pulsing-orb" />
    <text x="32" y="22" fill="#38bdf8" class="badge-text">AFFECTIVE COMPUTING &amp; EMOTION AI</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 142)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-size="44" class="title-text" filter="url(#subtleGlow)">
      Awesome Contextual AI
    </text>
    <text x="0" y="52" text-anchor="middle" fill="url(#primaryGrad)" font-size="44" class="title-text" filter="url(#subtleGlow)">
      &amp; Sensory Analytics
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">
    Curated Hub for Emotion Recognition • Multimodal Sentiment • Cognitive Perception
  </text>

  <!-- Feature Pills in Center Foreground -->
  <g transform="translate(300, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="67" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="500">🎭 Emotion AI</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(145, 0)">
      <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="75" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="500">👁️ Eye &amp; Face Gaze</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(305, 0)">
      <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="75" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="500">🎙️ Vocal Prosody</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(465, 0)">
      <rect width="135" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="67" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="500">⚡ Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="350" x2="1000" y2="350" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
